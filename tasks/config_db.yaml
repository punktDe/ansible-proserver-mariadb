---
- name: Configure MariaDB (FreeBSD)
  when: ansible_facts['system'] == 'FreeBSD'
  block:
    - name: Get MariaDB server version
      check_mode: no
      ansible.builtin.shell:
        cmd: >-
          /usr/local/libexec/mysqld --version |
          python3 -c
          'import sys, re; print(re.search("Ver[\s\t]*([0-9]+\.[0-9]+)", sys.stdin.readline()).group(1))'
      changed_when: no
      register: mariadb_get_server_version_result

    - name: Check if legacy config location must be used
      ansible.builtin.set_fact:
        mariadb_use_legacy_config_location_result: "{{ mariadb_get_server_version_result.stdout is version('10.5', '<') }}"

    - name: Remove obsolete my.cnf
      when: not mariadb_use_legacy_config_location_result
      ansible.builtin.file:
        path: "/usr/local/etc/my.cnf"
        state: absent

- name: Handle MariaDB nodes
  when: not mariadb.galera.arbitrator
  block:
    - name: Configure MariaDB (my.cnf)
      community.general.ini_file:
        path: "{{ config_filepath }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        state: "{{ 'present' if item.value is not none else 'absent' }}"
        owner: root
        mode: "0644"
      loop_control:
        label: "{{ config_filepath }} {{ item.section }}.{{ item.option }}={{ item.value }}"
      loop: "{{ mariadb['my.cnf'] | mariadb_ini_helper }}"
      vars:
        config_filepath: "{% if ansible_facts['system'] == 'FreeBSD' and mariadb_use_legacy_config_location_result %}/usr/local/etc/my.cnf{% else %}{{ mariadb.prefix.config }}/conf.d/zz-ansible.cnf{% endif %}"
      notify: Restart MariaDB

    # below the pool size: MariaDB uses innodb_buffer_pool_size as max (loose-: ignored by older versions)
    - name: Ensure MariaDB does not reserve 8 TiB for the InnoDB buffer pool (FreeBSD)
      when:
        - ansible_facts['system'] == 'FreeBSD'
        - not mariadb_use_legacy_config_location_result
        - "'loose-innodb_buffer_pool_size_max' not in mariadb['my.cnf']['mysqld'] | default({}, true)"
      community.general.ini_file:
        path: "{{ mariadb.prefix.config }}/conf.d/zz-ansible.cnf"
        section: mysqld
        option: loose-innodb_buffer_pool_size_max
        value: 8M
        state: "{{ 'absent' if mariadb_max_set_in_my_cnf else 'present' }}"
        owner: root
        mode: "0644"
      vars:
        mariadb_max_set_in_my_cnf: >-
          {{ mariadb['my.cnf'] | mariadb_ini_helper | map(attribute='option')
             | select('match', '^(loose[-_])?innodb[-_]buffer[-_]pool[-_]size[-_]max$') | list | length > 0 }}

    - name: Ensure MariaDB config set by Ansible overrules package defaults
      when: "ansible_facts['system'] == 'Linux' and mariadb['my.cnf'] | length > 0"
      ansible.builtin.file:
        dest: "{{ mariadb.prefix.config }}/mariadb.conf.d/zz-ansible.cnf"
        src: ../conf.d/zz-ansible.cnf
        state: link
      notify: Restart MariaDB
